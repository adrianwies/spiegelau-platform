services:
  mysql:
    image: mysql:8.4
    container_name: spiegelau-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root_dev
      MYSQL_DATABASE: spiegelau
      MYSQL_USER: spiegelau
      MYSQL_PASSWORD: spiegelau_dev

    ports:
      - "3307:3306"

    volumes:
      - spiegelau_mysql_data:/var/lib/mysql

  adminer:
    image: adminer:latest
    container_name: spiegelau-adminer
    restart: unless-stopped

    ports:
      - "8080:8080"

    depends_on:
      - mysql

volumes:
  spiegelau_mysql_data:


